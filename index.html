<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holy Impact 대학 청년 새가족 교재</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
:root{--bg:#fff;--surf:#f2f3f5;--ink:#23262b;--sub:#6b7078;--or:#e8691a;--line:#d9dbe0;--ft:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--surf:#202328;--ink:#e8e9eb;--sub:#9aa0a8;--or:#ff9448;--line:#34383e;--ft:#16181b}}
:root[data-theme="dark"]{--bg:#16181b;--surf:#202328;--ink:#e8e9eb;--sub:#9aa0a8;--or:#ff9448;--line:#34383e;--ft:#16181b}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav a{flex:none;padding:4px 12px;border-radius:999px;color:var(--sub);text-decoration:none;font-size:14px;border:1px solid var(--line)}
nav a.on{background:var(--or);border-color:var(--or);color:var(--ft);font-weight:700}
nav a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:32px 20px 80px}
h1,h2{font-family:"Noto Serif KR",serif;font-weight:700;line-height:1.3;margin:0}
.title{display:flex;gap:16px;align-items:stretch;margin-bottom:28px}
.title b{font:700 56px/1 "Noto Serif KR",serif;color:var(--or);padding-right:16px;border-right:2px solid var(--line)}
.title span{align-self:center;font:400 30px/1.2 "Noto Serif KR",serif}
.open{background:var(--surf);border-left:5px solid var(--or);padding:16px 18px;border-radius:0 12px 12px 0;margin-bottom:32px}
.open small{display:block;color:var(--or);font-weight:700}
.q{margin:36px 0}.q>p{font-weight:700;margin:0 0 10px}.q>p i{font-style:normal;color:var(--or);margin-right:8px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px}
.opt{display:block;margin:4px 0}.opt input{accent-color:var(--or);margin-right:8px}
blockquote{margin:12px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);color:var(--sub);font-size:15px;line-height:1.7}
blockquote b{color:var(--or)}
.share{background:var(--surf);border-radius:12px;padding:16px 18px;margin-top:40px}
.share b{color:var(--or)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px}
.pager a,.start{padding:10px 18px;border-radius:10px;background:var(--or);color:var(--ft);text-decoration:none;font-weight:700}
.pager a.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.list a{display:flex;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list b{font:700 28px "Noto Serif KR",serif;color:var(--or);width:32px}.list em{margin-left:auto;font-style:normal;color:var(--sub);font-size:14px}
.hero h1{font-size:34px;margin:12px 0}.hero p{color:var(--sub);margin:0 0 28px}
main{max-width:none;padding:0 0 80px}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 0}
.ph{position:relative;height:260px;overflow:hidden;background:var(--surf)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.flip img{transform:scaleX(-1)}
.ph.solid{background:var(--or)}
.ph::after{content:"";position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.ph.solid::after{display:none}
.ph-in{position:absolute;z-index:2;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;padding:0 20px 24px;display:flex;align-items:flex-end;gap:16px}
.ph-in b{font:700 72px/.85 "Noto Serif KR",serif;color:var(--or);padding-right:16px;border-right:2px solid var(--or)}
.ph-in span{font:400 30px/1.1 "Noto Serif KR",serif;letter-spacing:.06em}
.ph-in small{display:block;font:400 14px "Noto Sans KR",sans-serif;color:var(--sub);letter-spacing:.2em;margin-top:6px}
.ph.solid b{color:#fff;border-color:#fff}.ph.solid span,.ph.solid small{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph img{filter:brightness(.7)}}
:root[data-theme="dark"] .ph img{filter:brightness(.7)}
.cover{position:relative;min-height:70vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;background:#555}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.78)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.4))}
.cover div{position:relative;z-index:2;padding:40px 20px}
.cover h1{font-size:clamp(44px,10vw,88px);line-height:1.05;margin:0;color:#fff}
.cover p{margin:14px 0 28px;letter-spacing:.2em;font-size:13px}
.cover .start{display:inline-block}
.lm svg{width:100%;height:auto;display:block;touch-action:none;background:var(--surf);border-radius:14px;cursor:ns-resize}
.lg{display:flex;gap:6px;margin:6px 0}
.lg button{position:relative;flex:1;padding:4px 0;border-radius:6px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15px;line-height:1;cursor:pointer}
.lg button::after{content:"";position:absolute;inset:-6px 0}
.lg .bp.on{background:#c8520e;color:#fff;border-color:transparent}.lg .bs.on{background:#1f6fc0;color:#fff;border-color:transparent}
.hint{color:var(--sub);font-size:21px;margin:8px 0 12px}
.lm>p:first-child{font-size:24px}.lm textarea{font-size:24px}
</style>
</head>

{en:"GOD",ko:"하나님",open:"‘하나님’하면 생각나는 단어는 무엇입니까? 3가지씩 나눠 봅시다.",
 qs:[{q:"하나님(신)의 존재에 대한 당신의 생각은 어떤 것입니까? 그렇게 생각하는 이유는 무엇입니까?",opts:["유신론: 하나님은 존재한다.","무신론: 하나님은 존재하지 않는다.","불가지론: 하나님이 존재하는지 알 수 없다."],note:"신과 인간의 관계는 유치원생과 대학교수의 관계에 비유할 수 있습니다. 유치원생이 교수의 이론을 다 이해하지 못한다고 틀렸다고 할 수는 없습니다. 교수가 눈높이를 낮춰 주는 만큼 대화할 수 있듯, 하나님이 눈높이를 맞추어 다가오시면 우리는 그분을 만나고 경험할 수 있습니다."},
 {q:"성경은 하나님께서 이 땅을 창조하셨다고 선언합니다. 하나님은 이 세상을 어떻게 만드셨습니까?",v:[["창세기 1:3","하나님께서 말씀하시기를 “빛이 있으라”하시니 빛이 생겼습니다."],["창세기 2:2-3","하나님께서는 그 하시던 일을 일곱째 날에 다 마치셨습니다. 그리고 그 하시던 모든 일을 마치고 일곱째 날에 쉬셨습니다. 하나님께서 일곱째 날을 복 주시고 거룩하게 하셨습니다. 하나님께서 창조하시고 만드시던 모든 일을 마치시고 이날에 쉬셨기 때문입니다."]],note:"하나님은 6일 동안 그분의 능력의 말씀으로 아무것도 없는 것 중에서 만물을 지으셨는데, 매우 좋게 만드셨습니다."},
 
 {q:"하나님이 창조하신 것들 중 최고의 작품은 무엇이라 생각하는지 나누어 봅시다.",v:[["창세기 2:7","여호와 하나님께서 땅에서 취하신 흙으로 사람을 빚으시고 그 코에 생기를 불어넣으시자 사람이 생명체가 됐습니다."],["창세기 1:27-28","하나님께서 사람을 그분의 형상대로 창조하시니, 곧 하나님의 형상대로 사람을 창조하시되 하나님께서 그들을 남자와 여자로 창조하셨습니다. 하나님께서 그들에게 복을 주시며 그들에게 말씀하시기를 “자식을 많이 낳고 번성해 땅에 가득하고 땅을 정복하라. 바다의 물고기와 공중의 새와 땅 위에 기는 모든 생물을 다스리라.” 하셨습니다."]],note:"당신은 하나님이 지으신 하나님의 형상(Image of God)입니다."}],
 share:"뭐라고 정의할 수는 없지만 신이 존재한다는 것을 느껴본 적이 있다면 나눠 봅시다.",vs:[["로마서 1:20","세상이 창조된 이후로 하나님의 보이지 않는 것들, 곧 그분의 영원하신 능력과 신성이 그분이 만드신 만물을 통해 명백히 보여 알게 됐으므로 그들은 변명할 수 없습니다."]]},
{en:"MAN",ko:"인간",lm:1,open:"Life Map: 나의 인생 그래프를 그려봅시다. (육적인 삶 & 영적인 삶)",
 qs:[{q:"성경은 예수님께서 왜 이 땅에 오셨다고 말합니까?",v:[["요한복음 3:16-17","하나님께서 세상을 이처럼 사랑하셔서 독생자를 주셨으니 이는 그를 믿는 사람마다 멸망하지 않고 영생을 얻게 하려는 것이다. 하나님께서 자신의 아들을 세상에 보내신 것은 세상을 심판하시려는 것이 아니라 그 아들을 통해 세상을 구원하시려는 것이다."]]},
 {q:"우리는 무엇으로부터 구원받는 것이 필요하다고 생각하십니까?",note:"죄를 가리키는 그리스어 ‘하마르티아’는 본디 과녁에서 벗어난 상태(off target)를 말합니다. 잘못은 과녁판이나 화살이 아니라 조준에 있습니다. 결국 죄는 하나님을 향해 정조준되어 있어야 할 인간의 중심이 하나님을 떠나 있는 상태입니다."},
 {q:"내 안에 죄가 있다고 느꼈던 적이 있다면 나눠봅시다. 그리고 당신의 인생 가치관, 꿈과 계획과 마음가짐이 하나님의 기준에 맞지 않는다고 생각하는 부분이 있다면 나눠봅시다.",v:[["갈라디아서 5:13","형제들이여, 하나님께서 여러분을 부르셔서 자유하게 하셨습니다. 그러나 그 자유를 육체의 만족을 위한 기회로 삼지 말고 도리어 사랑으로 서로 종노릇하십시오."]]},
 {q:"당신의 미래에 대해 특별히 불안함을 느끼는 부분은 어떤 것이 있습니까?",note:"아기가 엄마 품에서 세상 그 어떤 것과도 비교할 수 없는 평안을 머금고 잠을 자듯, 우리가 하나님의 품에 안길 때 인생의 불안에서 벗어나 참된 평안을 얻을 수 있습니다."}],
 share:"이 세상이 죄로 타락했다고 생각하십니까? 특별히 언제 그런 생각이 드는지 나누어 봅시다."},
{en:"JESUS",ko:"예수님",open:"믿음의 자세로 예수님을 영접하기만 하면 구원의 은혜가 임합니다. 성경은 모든 사람에게 구원의 길이 열려 있다고 말합니다.",
 qs:[{q:"사람은 누구나 그 한계가 명확합니다. 사람들은 죄로 인해 어떤 상태에 있습니까?",v:[["로마서 6:23","죄의 대가는 죽음이요, 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생입니다."]]},
 {q:"구약 사람들은 어떻게 죄의 대가인 죽음으로부터 벗어날 수 있었습니까?",v:[["레위기 4:34-35","제사장은 속죄제물의 피를 찍어다가 번제단의 뿔에 바르고 그 나머지 피는 제단 밑에 쏟아 부어야 한다. 그는 그 모든 기름을 화목제물에서 기름을 제거한 것 같이 이 예물의 모든 기름을 떼어 내야 한다. 제사장은 그것을 제단 위에서 여호와와의 화제와 함께 태워야 한다. 제사장이 그가 지은 죄를 위해 속죄하면 그는 용서받을 것이다."]],note:"인간을 구원할 수 있는 분은 완전한 제사장이어야 하고, 그 제물 역시 흠 없고 정결해야 합니다. 이 두 조건을 완벽하게 충족시키시는 분이 바로 예수 그리스도입니다."},
 {q:"예수님은 왜 십자가에서 죽으셔야 했을까요?",v:[["이사야 53:5","우리의 허물이 그를 찔렀고 우리의 악함이 그를 짓뭉갰다. 그가 책망을 받아서 우리가 평화를 누리고 그가 매를 맞아서 우리의 병이 나은 것이다."]]},
 {q:"예수님의 죽음으로 인해 하나님과 우리 사이에 일어난 변화는 무엇입니까?",v:[["에베소서 2:14-16","그리스도는 우리의 화평이시니 자기의 육체로 둘을 하나로 만드신 분이십니다. 그분은 중간에 막힌 담, 곧 원수된 것을 헐어 내셨고 조문으로 된 계명의 율법을 폐하셨습니다. 이는 그리스도가 그분 안에서 이 둘로 한 새 사람을 창조해 화평을 이루게 하시고 십자가를 통해 이 둘을 한 몸으로 하나님과 화목하게 하셔서 자기 안에서 원수된 것을 없애 버리시기 위한 것입니다."],["누가복음 23:42-43","그리고 말했습니다. “예수여, 당신의 나라에 들어가실 때 저를 기억해 주십시오.” 예수께서 그에게 대답하셨습니다. “내가 진실로 네게 말한다. 오늘 네가 나와 함께 낙원에 있을 것이다.”"],["로마서 8:31-34","그러면 이 일에 대해 우리가 무슨 말을 하겠습니까? 하나님께서 우리를 위하시면 누가 우리를 대적하겠습니까? 자기 아들을 아끼지 않으시고 우리 모두를 위해 내어 주신 분께서 어떻게 아들과 함께 모든 것을 우리에게 은혜로 주지 않으시겠습니까? 누가 하나님께서 택하신 자들을 고소할 수 있겠습니까? 의롭다고 인정하신 분은 하나님이십니다. 누가 정죄하겠습니까? 죽었을 뿐 아니라 살리심을 받으신 분은 그리스도 예수십니다. 그분은 하나님 오른편에 계시며 우리를 위해 간구하십니다."]],note:"이제 당신은 예수 그리스도로 말미암아 당신의 죄가 모두 용서받았다고 믿습니까? 사랑은 표현하는 것이고, 신앙은 고백하는 것입니다. 당신이 자신의 믿음을 표현할 수 있는 말들을 써봅시다."},
 {q:"예수 그리스도를 주님으로 영접하고 내 인생의 통치권을 예수님께 드릴 때, 내 심령 안에서는 이미 변화가 일어난 것입니다. 그 변화의 구체적 모습은 어떻게 나타납니까?",opts:["인생 주인의 변화: 내 인생의 주인이 누구로부터 누구로 바뀌었습니까?","인격과 성품의 변화","추구하는 영역의 변화"],v:[["골로새서 2:6-7","그러므로 여러분은 그리스도 예수를 주로 영접한 것처럼 주 안에서 사십시오. 여러분은 주 안에 뿌리를 내리며 세움을 받으며 가르침을 받은 대로 믿음 안에 굳게 서서 감사가 넘치게 하십시오."],["베드로후서 1:4-7","그분은 우리에게 보배롭고 지극히 큰 약속을 주셨는데 이는 이것들을 통해 여러분이 세상의 정욕 가운데 썩어져 가는 것을 피하고 신의 성품에 참여하는 사람들이 되게 하려는 것입니다. 그러므로 여러분은 더욱 힘써 믿음에 덕을, 덕에 지식을, 지식에 절제를, 절제에 인내를, 인내에 경건을, 경건에 형제 우애를, 형제 우애에 사랑을 공급하십시오."],["로마서 8:5-6","육신을 따라 사는 사람은 육신의 일을 생각하지만 성령을 따라 사는 사람은 성령의 일을 생각합니다. 육신의 생각은 죽음이지만 성령의 생각은 생명과 평안입니다."],["디모데전서 4:7-8","저속하고 헛되게 꾸며낸 이야기를 버리고 오직 경건에 이르도록 그대 자신을 단련하여라. 육체를 단련하는 것은 조금은 유익하나 경건은 모든 일에 유익하며 이 세상과 앞으로 올 세상의 생명을 약속한다."]]}],
 share:"나의 죄가 용서받았다는 믿음과 사랑을 나의 말로 표현해 봅시다."},
{en:"SPIRIT",ko:"성령님",open:"보이는 세계는 보이지 않는 세계에 의해 움직입니다. 사랑, 우정, 꿈, 비전, 열정 등은 보이지 않지만 이것들이 세상을 움직입니다. 영적인 세계 가운데 한편으로는 악령이 존재하며, 또한 성령님도 분명히 존재하십니다.",
 qs:[{q:"성령님은 어떤 분일까요?",note:"예수님께서는 성령님을 보혜사(Parakletos)로 소개하셨습니다. ‘늘 곁에 있어서 어떤 사람을 돕거나 변호하기 위해 부름 받은 사람’을 뜻합니다. 성령님은 예수 그리스도를 증거하는 증인이며 변호인이십니다."},
 {q:"성령님이 하시는 일입니다. 당신에게 가장 필요하다고 생각하는 것을 순서대로 적어보고 나누어 봅시다.",opts:["예수님을 주님으로 고백하게 하십니다. (고린도전서 12:3)","죄를 깨닫게 하십니다. (요한복음 16:8)","우리가 하나님의 자녀임을 증거하십니다. (로마서 8:16)","합당한 예배를 드리게 하십니다. (요한복음 4:24)","권능을 주십니다. (사도행전 1:8)","말씀을 깨닫게 하십니다. (베드로후서 1:21)","평안을 주십니다. (이사야 63:14)"],v:[["고린도전서 12:3","그러므로 나는 여러분에게 알려 드립니다. 하나님의 영으로 말하는 사람은 아무도 “예수는 저주받은 사람이다” 라고 할 수 없고 또 성령으로 말미암지 않고는 “예수는 주이시다” 라고 할 수 없습니다."],["요한복음 16:8","보혜사가 오시면 죄에 대해, 의에 대해, 심판에 대해 세상을 책망하실 것이다."],["로마서 8:16","성령은 친히 우리의 영과 더불어 우리가 하나님의 자녀임을 증거합니다."],["요한복음 4:24","하나님은 영이시니 하나님께 예배드리는 사람은 영과 진리로 예배드려야 한다."],["사도행전 1:8","그러나 성령께서 너희에게 오시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 될 것이다."],["베드로후서 1:21","예언은 언제나 사람의 뜻을 따라 나온 것이 아니라 성령의 감동하심을 받은 사람들이 하나님께 받은 말씀을 전한 것이기 때문입니다."],["이사야 63:14","평원으로 내려가는 소 떼처럼 여호와의 영이 그들을 쉬게 하셨다. 주께서 이렇게 주의 백성을 인도하셔서 그 이름을 스스로 영광스럽게 하셨다."]]},
 {q:"성령 충만한 사람의 삶은 어떤 모습일까요?",note:"성령충만이란 성령님께 온전히 다스림을 받는 상태를 말합니다. 은사는 ‘은혜로 주시는 선물’이며 교회의 유익을 위해 사용합니다. 성령의 열매는 우리의 성품이 예수 그리스도의 성품으로 변화되는 것입니다.",v:[["에베소서 5:18","또한 술에 취하지 마십시오. 잘못하면 방탕에 빠지기 쉽습니다. 오히려 성령으로 충만하게 되십시오."],["고린도전서 12:7-11","각 사람에게 성령을 나타내시는 것은 성도 공동의 유익을 위한 것입니다. 어떤 이에게는 성령으로 지혜의 말씀을 주시고 어떤 이에게는 같은 성령으로 지식의 말씀을 주십니다. 어떤 이에게는 같은 성령으로 믿음을, 어떤 이에게는 같은 성령으로 치유의 은사를, 어떤 이에게는 능력 행하는 은사를, 어떤 이에게는 예언하는 은사를, 어떤 이에게는 영을 분별하는 은사를, 어떤 이에게는 여러 가지 방언하는 은사를, 또 어떤 이에게는 방언 통역하는 은사를 주십니다. 그러나 이 모든 것을 행하시는 이는 한 분이신 같은 성령이시며 그분이 원하시는대로 각 사람에게 은사를 나눠 주시는 것입니다."],["갈라디아서 5:22-23","그러나 성령의 열매는 사랑과 기쁨과 화평과 오래 참음과 친절과 선함과 신실함과 온유와 절제입니다. 이런 것들을 금지할 율법은 없습니다."]]},
 {q:"성령님을 사모하십시오.",note:"성령님께 시간을 드리십시오. 마음을 드리십시오. 성령님은 사모하는 영혼을 만족시키시고 충만하게 임하십니다."}],
 share:"내가 경험한 성령님에 대해 나누어 봅시다."},
{en:"BIBLE",ko:"성경",open:"전 세계 도서 중 최고의 베스트셀러는 무엇일까요? 성경입니다. 과연 성경이 어떤 책이길래 이런 일들이 일어났는지 구체적으로 살펴봅시다.",
 qs:[{q:"‘성경’하면 떠오르는 이미지는 어떤 것입니까?",note:"성경은 순수하고 무조건적인 사랑의 근원, 바로 하나님의 사랑을 보여주는 당신을 향한 러브레터입니다."},
 {q:"성경의 저자는 누구입니까?",v:[["디모데후서 3:16","모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니"],["베드로후서 1:21","예언은 언제나 사람의 뜻을 따라 나온 것이 아니라 성령의 감동하심을 받은 사람들이 하나님께 받은 말씀을 전한 것이기 때문입니다."]],note:"성경의 구약은 선지자, 신약은 사도들이 썼습니다. 이들은 모두가 하나님의 감동을 받은 사람들입니다. 그러므로 성경의 저자는 성령님이십니다."},
 {q:"당신은 성경이 순전한 하나님의 말씀이라 믿습니까? 그리고 이것이 신앙생활 하는 데에 왜 중요한지 나누어 봅시다.",v:[["데살로니가전서 2:13","또한 우리가 하나님께 끊임없이 감사드리는 것은 여러분이 우리에게서 들은 하나님의 말씀을 받을 때 사람의 말로 받지 않고 실제 하나님의 말씀으로 받아들였기 때문입니다."]]},
 {q:"말씀이 우리에게 주시는 유익입니다. 이 중 당신이 최근에 체험했던 것은 무엇입니까?",v:[["시편 119:9, 11","청년이 어떻게 그 길을 깨끗하게 지킬 수 있겠습니까? 주의 말씀을 따라 주의하는 것입니다. 내가 주께 죄짓지 않으려고 주의 말씀을 마음에 품었습니다."],["시편 119:105","주의 말씀은 내 발의 등불이요, 내 길의 빛입니다."],["히브리서 4:12-13","하나님의 말씀은 살아 있고 힘이 있으며 양날 선 어떤 칼보다도 더 예리해 혼과 영과 관절과 골수까지 찔러 쪼개기까지 하며 마음의 생각과 의도를 분별해냅니다. 그러므로 어떤 피조물이라도 하나님 앞에 숨을 수 없고 오히려 모든 것은 우리에게서 진술을 받으실 그분의 눈앞에 벌거벗은 채 드러나 있습니다."],["에베소서 6:13, 17","그러므로 하나님의 전신갑주를 입으십시오. 이는 여러분이 악한 날에 능히 대적하고 모든 것을 행한 후에 굳건히 서기 위한 것입니다. 구원의 투구와 성령의 검, 곧 하나님의 말씀으로 무장하십시오."],["요한복음 15:10","내가 내 아버지의 계명을 지키고 아버지의 사랑 안에 있는 것 같이 너희도 내 계명을 지키면 내 사랑 안에 있을 것이다."]]},
 {q:"말씀을 가까이 하기에 어렵다면 그 이유는 무엇입니까?",opts:["죄로 인해 하나님 앞에 나아가기 꺼려지기 때문에","성경의 가치와 중요성을 모르기 때문에","성경을 읽는 것이 지루하고 무의미하게 느껴지기 때문에","습관이 되어 있지 않기 때문에","바쁘고 피곤하기 때문에","기타"],note:"말씀을 가까이 하는 방법으로 QT와 일대일 제자양육이 있습니다."},
 {q:"QT 연습: 오늘의 말씀 요한복음 15장 1-7절. 제목 / 말씀요약 / 나에게 주신 말씀과 묵상 / 기도 / 말씀 적용 및 실천해보기 순서로 기록해 봅시다.",note:"QT는 Quiet Time의 약자로, 매일 조용한 시간과 장소를 정해 하나님을 인격적으로 만나고, 성경 말씀을 통해 나를 향한 하나님의 음성을 듣고 묵상하며 삶에 적용함으로써 삶의 변화와 성장을 이루고자 하는 경건훈련입니다."}],
 share:"말씀이 분명하고 실제적으로 마음에 와닿은 적이 있었습니까? 그리고 현재 당신의 삶에 파고드는 말씀이 있다면 그 말씀은 무엇입니까?"},
{en:"CHURCH",ko:"교회",open:"1983년, 하용조 목사는 한국에서 목회를 해보지 않겠느냐는 제의를 받았습니다. ‘2천 년이 지난 지금도 주님이 의도하시고 사도행전에서 보여 주셨던 그 교회가 가능할까?’ 그 응답으로 소그룹 성경공부가 시작되었고, 사도행전적 공동체로 성숙해 갔습니다.",
 qs:[{q:"당신이 생각하는 이상적인 교회 공동체는 어떤 모습입니까?"},
 {q:"성경이 말하는 교회는 무엇인지 생각해봅시다.",v:[["고린도전서 3:16","여러분은 자신이 하나님의 성전인 것과 하나님의 성령께서 여러분 안에 계시는 것을 알지 못합니까?"],["에베소서 2:20-22","여러분은 사도들과 예언자들의 기초 위에 세워진 사람들이요, 그리스도 예수께서 친히 모퉁잇돌이 되셨습니다. 그리스도 안에서 건물 전체가 서로 연결돼 주 안에서 함께 자라 거룩한 성전이 됩니다. 여러분도 성령 안에서 하나님께서 거하실 처소가 되기 위해 그리스도 안에서 함께 세워져 가고 있습니다."]]},
 {q:"교회의 목적은 무엇입니까?",opts:["예배 (요한계시록 4:11)","양육 (에베소서 4:13)","사역 (디모데전서 5:10)","선교 (사도행전 1:8)"],v:[["요한계시록 4:11","주 우리 하나님이시여, 영광과 존귀와 능력을 받으시기에 합당하십니다. 주께서 만물을 창조하셨고 주의 기쁘신 뜻을 인해 만물이 존재했고 또 창조됐습니다."],["에베소서 4:13","우리는 모두 하나님의 아들을 믿는 것과 아는 지식에 하나가 돼 온전한 사람을 이루어 그리스도께서 충만하신 정도까지 도달해야 합니다."],["디모데전서 5:10","또 그는 선한 행실들로 인정을 받는 사람이어야 한다. 곧 자녀를 잘 부양했든지 나그네를 잘 대접했든지 성도들의 발을 씻겼든지 환난당한 사람들을 구제했든지 모든 선한 일에 헌신한 사람이어야 한다."],["사도행전 1:8","그러나 성령께서 너희에게 오시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 될 것이다."]]}],
 share:"위의 4가지 목적들 가운데 당신의 교회 생활 중에 미흡한 부분은 무엇입니까?"}
];
const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav");
const get=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const done=i=>L[i].qs.filter((_,j)=>get(`a${i}.${j}`).trim()||get(`o${i}.${j}`).replace(/[,\[\]]/g,"")).length;
const AG=["10","15","20","25","30","35","현재"],LC={ph:"#e8691a",sp:"#2783de"};let lmA="ph";
const lmv=(r,i)=>{const v=get(`lm.${r}.${i}`);return v===""?(r=="ph"?60:40):+v};
function LM(){lmA="ph";return `<section class="q lm"><p style="margin:0"><i style="font-style:normal;color:var(--or)">Life Map</i> 나의 인생 그래프</p><div class="lg"><button class="bp on" data-lr="ph">육적인 삶</button><button class="bs" data-lr="sp">영적인 삶</button></div><svg id="lms" viewBox="0 0 700 440" role="img" aria-label="인생 그래프"></svg><p class="hint">위에서 선택한 삶의 점을 위아래로 끌어서 그려 보세요.</p><textarea data-a="lm" placeholder="인생의 전환점이 된 순간을 적어 보세요">${esc(get("alm"))}</textarea></section>`}
function drawLM(){const s=$("#lms");if(!s)return;const X=i=>80+i*95,Y=v=>400-v*3.6;
 let g=`${[40,130,220,310,400].map(y=>`<line x1="60" x2="690" y1="${y}" y2="${y}" stroke="var(--line)" ${y==220?'stroke-dasharray="4 4"':""}/>`).join("")}<text x="4" y="50" font-size="18" fill="var(--sub)">행복</text><text x="4" y="396" font-size="18" fill="var(--sub)">힘듦</text>`;
 AG.forEach((a,i)=>g+=`<text x="${X(i)}" y="428" font-size="18" text-anchor="middle" fill="var(--sub)">${a}${i<6?"세":""}</text>`);
 ["sp","ph"].sort((a,b)=>(a==lmA)-(b==lmA)).forEach(r=>{const p=AG.map((_,i)=>[X(i),Y(lmv(r,i))]),on=r==lmA;
  g+=`<g opacity="${on?1:.45}"><path d="${p.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ")}" fill="none" stroke="${LC[r]}" stroke-width="${on?4:3}" stroke-linejoin="round" stroke-linecap="round"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="${on?8:5}" fill="var(--bg)" stroke="${LC[r]}" stroke-width="3"/>`).join("")}</g>`});
 s.innerHTML=g}
function bindLM(){const s=$("#lms");if(!s)return;drawLM();let d=null;
 const Yp=e=>{const b=s.getBoundingClientRect();return[(e.clientX-b.left)*700/b.width,(e.clientY-b.top)*440/b.height]};
 const mv=e=>{if(d==null)return;const y=Yp(e)[1];set(`lm.${lmA}.${d}`,String(Math.round(Math.max(0,Math.min(100,(400-y)/3.6)))));drawLM()};
 s.onpointerdown=e=>{const x=Yp(e)[0];d=Math.max(0,Math.min(6,Math.round((x-80)/95)));s.setPointerCapture(e.pointerId);mv(e)};
 s.onpointermove=mv;s.onpointerup=s.onpointercancel=()=>{d=null};
 document.querySelectorAll("[data-lr]").forEach(b=>b.onclick=()=>{lmA=b.dataset.lr;document.querySelectorAll("[data-lr]").forEach(x=>x.classList.toggle("on",x==b));drawLM()})}
function draw(){
 const n=parseInt(location.hash.slice(1))||0;
 nav.innerHTML=`<a href="#0" class="${n?"":"on"}">처음</a>`+L.map((l,i)=>`<a href="#${i+1}" class="${n==i+1?"on":""}">${i+1}강 ${l.ko}</a>`).join("");
 const on=nav.querySelector(".on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
 if(!n){app.innerHTML=`<div class="cover"><img src="${IMG.tree}" alt=""><div><h1>Holy Impact<br>새신자 교재</h1><p>온누리교회 대학청년부 · 7강 과정</p><a class="start" href="#1">1강 시작하기</a></div></div><div class="wrap"><p style="color:var(--sub);margin:0 0 8px">질문에 답을 적어 두면 이 기기에 저장됩니다.</p><div class="list">${L.map((l,i)=>`<a href="#${i+1}"><b>${i+1}</b><span>${l.ko} <small>${l.en}</small></span><em>${done(i)}/${l.qs.length}</em></a>`).join("")}</div></div>`;scrollTo(0,0);return}
 const i=n-1,l=L[i];
 app.innerHTML=`<div class="ph ${H[n]?"":"solid"} ${n==3?"flip":""}">${H[n]?`<img src="${IMG[H[n]]}" alt="">`:""}<div class="ph-in"><b>${n}</b><span>${l.en}<small>${l.ko}</small></span></div></div><div class="wrap">
 <div class="open"><small>마음 열기</small>${l.open}</div>${l.lm?LM():""}`+
 l.qs.map((q,j)=>`<section class="q"><p><i>${j+1}.</i>${q.q}</p>
 ${q.opts?q.opts.map((o,k)=>`<label class="opt"><input type="checkbox" data-o="${i}.${j}" value="${k}" ${JSON.parse(get(`o${i}.${j}`)||"[]").includes(k)?"checked":""}>${o}</label>`).join(""):""}
 <textarea data-a="${i}.${j}" aria-label="${j+1}번 답" placeholder="나의 생각을 적어 보세요">${esc(get(`a${i}.${j}`))}</textarea>
 ${(q.v||[]).map(v=>`<blockquote><b>${v[0]}</b> ${v[1]||""}</blockquote>`).join("")}
 ${q.note?`<blockquote>${q.note}</blockquote>`:""}</section>`).join("")+
 `<div class="share"><b>나눔</b><br>${l.share}${(l.vs||[]).map(v=>`<blockquote><b>${v[0]}</b> ${v[1]||""}</blockquote>`).join("")}</div>
 <div class="pager">${i?`<a class="ghost" href="#${n-1}">이전 강의</a>`:`<a class="ghost" href="#0">처음으로</a>`}${i<6?`<a href="#${n+1}">다음 강의</a>`:`<a href="#0">처음으로</a>`}</div></div>`;
 bindLM();scrollTo(0,0);
}
app.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.a)set("a"+t.dataset.a,t.value);
 if(t.dataset.o){const c=[...app.querySelectorAll(`[data-o="${t.dataset.o}"]:checked`)].map(x=>+x.value);set("o"+t.dataset.o,JSON.stringify(c))}});
addEventListener("hashchange",draw);draw();
</script>
</body>
</html>
